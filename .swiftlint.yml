# SwiftLint configuration for FinanceApp

# Paths
included:
  - FinanceApp-iOS
  - FinanceApp-macOS
  - Packages

excluded:
  - .build
  - DerivedData
  - Packages/*/build
  - "**/*.generated.swift"

# Rules
disabled_rules:
  - trailing_comma

opt_in_rules:
  - array_init
  - attributes
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - extension_access_modifier
  - fallthrough
  - fatal_error_message
  - file_name_no_space
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - implicit_return
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - modifier_order
  - multiline_arguments
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - pattern_matching_keywords
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - private_action
  - private_outlet
  - prohibited_super_call
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - vertical_parameter_alignment_on_call
  - yoda_condition

# Rule configurations
line_length:
  warning: 120
  error: 150
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 400
  error: 600

type_body_length:
  warning: 300
  error: 500

function_body_length:
  warning: 50
  error: 80

function_parameter_count:
  warning: 6
  error: 8

type_name:
  min_length: 3
  max_length: 50

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - x
    - y
    - i
    - j
    - to
    - db

nesting:
  type_level: 3
  function_level: 5

# Force unwrap is an error in a finance app
force_unwrapping:
  severity: error

force_cast:
  severity: error

force_try:
  severity: error

# Custom rules
custom_rules:
  no_double_for_money:
    name: "No Double for Money"
    regex: '(amount|price|balance|total|sum|budget|cost|fee|tax|payment|salary|income|expense|debt|credit|debit)\s*:\s*Double'
    message: "Use Decimal instead of Double for monetary values to avoid floating-point errors."
    severity: error

  no_print_statement:
    name: "No print() in production code"
    regex: '^\s*print\s*\('
    match_kinds:
      - identifier
    message: "Use OSLog/Logger instead of print(). print() should not be in production code."
    severity: warning
    excluded: ".*Tests.*"

  require_accessibility:
    name: "Accessibility Label Required"
    regex: '\.onTapGesture\s*\{'
    message: "Consider adding .accessibilityLabel() when using tap gestures for VoiceOver support."
    severity: warning
