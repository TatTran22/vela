name: FinanceApp
options:
  bundleIdPrefix: com.vela.financeapp
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  FinanceCore:
    path: Packages/FinanceCore
  FinanceData:
    path: Packages/FinanceData
  FinanceUI:
    path: Packages/FinanceUI

targets:
  FinanceApp-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FinanceApp-iOS/Sources
    resources:
      - path: FinanceApp-iOS/Resources
        optional: true
    dependencies:
      - package: FinanceCore
      - package: FinanceData
      - package: FinanceUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vela.financeapp.ios
        INFOPLIST_GENERATION_MODE: GeneratedByBuildSystem
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SWIFT_EMIT_LOC_STRINGS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic

  FinanceApp-macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: FinanceApp-macOS/Sources
    resources:
      - path: FinanceApp-macOS/Resources
        optional: true
    dependencies:
      - package: FinanceCore
      - package: FinanceData
      - package: FinanceUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vela.financeapp.macos
        INFOPLIST_GENERATION_MODE: GeneratedByBuildSystem
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: true
        SWIFT_EMIT_LOC_STRINGS: true
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: ""

schemes:
  FinanceApp-iOS:
    build:
      targets:
        FinanceApp-iOS: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  FinanceApp-macOS:
    build:
      targets:
        FinanceApp-macOS: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
